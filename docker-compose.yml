version: '3.8'

services:
  assets-service:
    build: ./assets-service
    ports:
      - "8001:8001"
    volumes:
      - ./assets-service:/app

  readings-service:
    build: ./readings-service
    ports:
      - "8002:8002"
    volumes:
      - ./readings-service:/app

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - assets-service
      - readings-service
