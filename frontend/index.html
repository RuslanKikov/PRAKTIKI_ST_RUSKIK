<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АСКУЭ-Лайт | Дашборд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">АСКУЭ-Лайт</h1>
        </div>
        <div class="text-sm text-gray-500">Панель управления</div>
    </nav>

    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-7xl mx-auto space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                    <div class="p-3 bg-blue-100 text-blue-600 rounded-xl text-2xl">🏠</div>
                    <div><p class="text-sm text-gray-500 font-medium">Всего объектов</p><p id="kpiObjects" class="text-2xl font-bold">0</p></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                    <div class="p-3 bg-green-100 text-green-600 rounded-xl text-2xl">🔌</div>
                    <div><p class="text-sm text-gray-500 font-medium">Счётчиков</p><p id="kpiMeters" class="text-2xl font-bold">0</p></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                    <div class="p-3 bg-purple-100 text-purple-600 rounded-xl text-2xl">📊</div>
                    <div><p class="text-sm text-gray-500 font-medium">Показаний</p><p id="kpiReadings" class="text-2xl font-bold">0</p></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-bold mb-4 text-gray-800">Новый объект</h2>
                        <div class="space-y-3">
                            <input type="text" id="objName" placeholder="Название (Кв. 1)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <input type="text" id="objAddress" placeholder="Адрес" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <button onclick="createObject()" id="btnObj" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition disabled:opacity-50">Создать</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-bold mb-4 text-gray-800">Новый счётчик</h2>
                        <div class="space-y-3">
                            <select id="objSelect" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select>
                            <input type="text" id="meterSerial" placeholder="Серийный номер" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <div class="flex gap-2">
                                <select id="meterModelSelect" class="w-1/2 px-2 py-2 border rounded-lg text-sm bg-white">
                                    <option value="Меркурий 201">Меркурий 201</option>
                                    <option value="Энергомера CE101">Энергомера</option>
                                    <option value="Микрон Р2">Микрон Р2</option>
                                </select>
                                <select id="meterTariffSelect" class="w-1/2 px-2 py-2 border rounded-lg text-sm bg-white">
                                    <option value="T-1">Т-1 (Одностав.)</option>
                                    <option value="T-2">Т-2 (День/Ночь)</option>
                                </select>
                            </div>
                            <button onclick="createMeter()" id="btnMeter" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition disabled:opacity-50">Добавить</button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-gray-800">Ввод показаний</h2>
                            <select id="meterSelect" onchange="loadReadings()" class="px-4 py-2 border rounded-lg text-sm bg-white max-w-xs outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                        <div class="flex gap-3">
                            <input type="number" id="readingValue" placeholder="Значение (кВт·ч)" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <button onclick="addReading()" id="btnReading" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-lg transition disabled:opacity-50">Отправить</button>
                        </div>
                        
                        <div id="chartContainer" class="mt-6 h-64">
                            <canvas id="myChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-bold mb-4 text-gray-800">История показаний</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="text-sm text-gray-500 border-b">
                                        <th class="pb-3 font-medium">Дата</th>
                                        <th class="pb-3 font-medium">Значение</th>
                                        <th class="pb-3 font-medium">Статус</th>
                                        <th class="pb-3 font-medium">Действие</th>
                                    </tr>
                                </thead>
                                <tbody id="readingsTable" class="text-sm"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-5 right-5 space-y-3 z-50"></div>

    <script>
        const API_ASSETS = "http://127.0.0.1:8001";
        const API_READINGS = "http://127.0.0.1:8002";
        let chartInstance = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-800' : type === 'error' ? 'bg-red-500' : 'bg-orange-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg font-medium transform transition-all duration-300 translate-x-20 opacity-0 max-w-sm`;
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-x-20', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-20', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function loadDropdowns() {
            try {
                const [resObj, resMeters] = await Promise.all([
                    fetch(`${API_ASSETS}/objects/`), fetch(`${API_ASSETS}/meters/`)
                ]);
                const objects = await resObj.json();
                const meters = await resMeters.json();

                document.getElementById('kpiObjects').innerText = objects.length;
                document.getElementById('kpiMeters').innerText = meters.length;

                document.getElementById('objSelect').innerHTML = objects.length === 0 ? '<option value="">-- Нет объектов --</option>' 
                    : objects.map(o => `<option value="${o.id}">${o.name} (${o.address})</option>`).join('');

                document.getElementById('meterSelect').innerHTML = meters.length === 0 ? '<option value="">-- Нет счётчиков --</option>' 
                    : meters.map(m => `<option value="${m.serial_number}">${m.serial_number} [${m.model}]</option>`).join('');
                
                if (meters.length > 0) loadReadings();
            } catch (e) { console.error(e); }
        }

        async function createObject() {
            const name = document.getElementById('objName').value.trim();
            const address = document.getElementById('objAddress').value.trim();
            if(!name || !address) return showToast("Заполните все поля!", "warning");

            const btn = document.getElementById('btnObj');
            btn.disabled = true; btn.innerText = "Загрузка...";

            try {
                const res = await fetch(`${API_ASSETS}/objects/`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, address})
                });
                const data = await res.json();
                if(res.ok) {
                    showToast("Объект успешно создан!");
                    document.getElementById('objName').value = '';
                    document.getElementById('objAddress').value = '';
                    loadDropdowns();
                } else { showToast(data.detail || "Ошибка", "error"); }
            } finally { btn.disabled = false; btn.innerText = "Создать"; }
        }

        async function createMeter() {
            const object_id = document.getElementById('objSelect').value;
            const serial_number = document.getElementById('meterSerial').value.trim();
            const model = document.getElementById('meterModelSelect').value;
            const tariff_id = document.getElementById('meterTariffSelect').value;
            if(!object_id || !serial_number) return showToast("Выберите объект и введите номер!", "warning");

            const btn = document.getElementById('btnMeter');
            btn.disabled = true; btn.innerText = "Загрузка...";

            try {
                const res = await fetch(`${API_ASSETS}/meters/`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({object_id, serial_number, model, tariff_id})
                });
                const data = await res.json();
                if(res.ok) {
                    showToast(`Счётчик ${data.serial_number} добавлен!`);
                    document.getElementById('meterSerial').value = '';
                    loadDropdowns();
                } else { showToast(data.detail || "Ошибка", "error"); }
            } finally { btn.disabled = false; btn.innerText = "Добавить"; }
        }

        async function addReading() {
            const meter_id = document.getElementById('meterSelect').value;
            const value = parseFloat(document.getElementById('readingValue').value);
            if(!meter_id || isNaN(value)) return showToast("Введите корректное значение!", "warning");

            const btn = document.getElementById('btnReading');
            btn.disabled = true; btn.innerText = "...";

            try {
                const res = await fetch(`${API_READINGS}/readings/`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({meter_id, value, reading_date: new Date().toISOString(), source: "WEB"})
                });
                const data = await res.json();
                if(res.ok) {
                    if(data.warning) showToast(data.warning, "warning");
                    else showToast("Показания сохранены!");
                    document.getElementById('readingValue').value = '';
                    loadReadings();
                } else { showToast(data.detail || "Ошибка", "error"); }
            } finally { btn.disabled = false; btn.innerText = "Отправить"; }
        }

        async function loadReadings() {
            const meter_id = document.getElementById('meterSelect').value;
            if(!meter_id) return;
            
            try {
                const res = await fetch(`${API_READINGS}/readings/${meter_id}`);
                const readings = await res.json();
                document.getElementById('kpiReadings').innerText = readings.length;
                readings.sort((a,b) => new Date(a.reading_date) - new Date(b.reading_date));

                document.getElementById('readingsTable').innerHTML = readings.map(r => {
                    const isAnomaly = r.status === 'ANOMALY';
                    const statusClass = isAnomaly ? 'text-red-600 bg-red-100' : r.status === 'CORRECTED' ? 'text-yellow-600 bg-yellow-100' : 'text-green-600 bg-green-100';
                    const actionBtn = isAnomaly ? `<button onclick="fixReading('${r.id}', ${r.value})" class="text-blue-600 hover:underline font-medium">Исправить</button>` : '-';
                    
                    return `
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                            <td class="py-3 text-gray-600">${new Date(r.reading_date).toLocaleString()}</td>
                            <td class="py-3 font-medium">${r.value}</td>
                            <td class="py-3"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusClass}">${r.status}</span></td>
                            <td class="py-3">${actionBtn}</td>
                        </tr>
                    `;
                }).join('');

                drawChart(readings);
            } catch (e) { console.error(e); }
        }

        async function fixReading(readingId, oldValue) {
            const newValue = prompt(`Текущее значение: ${oldValue}. Введите правильное (должно быть больше предыдущего):`);
            if(newValue === null || newValue.trim() === '' || isNaN(parseFloat(newValue))) return;

            try {
                const res = await fetch(`${API_READINGS}/readings/${readingId}`, {
                    method: 'PUT', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({value: parseFloat(newValue), reading_date: new Date().toISOString()})
                });
                const data = await res.json();
                
                if(res.ok) { 
                    showToast("Показание исправлено!"); 
                    loadReadings(); 
                } else {
                    showToast(data.detail || "Ошибка при исправлении", "error");
                }
            } catch(e) { showToast("Ошибка соединения с сервером", "error"); }
        }

        function drawChart(readings) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: readings.map(r => new Date(r.reading_date).toLocaleDateString()),
                    datasets: [{ 
                        label: 'кВт·ч', data: readings.map(r => r.value), 
                        borderColor: '#3b82f6', backgroundColor: gradient, borderWidth: 2, fill: true, tension: 0.4 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: false, grid: { borderDash: [2, 4], color: '#e5e7eb' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        window.onload = loadDropdowns;
    </script>
</body>
</html>
