name: Python Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd assets-service
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run tests
      run: |
        cd assets-service
        pytest
